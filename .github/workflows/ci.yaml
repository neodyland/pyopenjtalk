# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: ubuntu-latest
            python-version: '3.14'
          - os: ubuntu-24.04-arm
            python-version: '3.10'
          - os: ubuntu-24.04-arm
            python-version: '3.11'
          - os: ubuntu-24.04-arm
            python-version: '3.12'
          - os: ubuntu-24.04-arm
            python-version: '3.13'
          - os: ubuntu-24.04-arm
            python-version: '3.14'
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: 3.11
          - os: macos-latest
            python-version: 3.12
          - os: macos-latest
            python-version: 3.13
          - os: macos-latest
            python-version: 3.14
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: 3.11
          - os: windows-latest
            python-version: 3.12
          - os: windows-latest
            python-version: 3.13
          - os: windows-latest
            python-version: 3.14

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Lint with pysen
      run: |
        pysen run lint
    - name: Test with pytest
      run: |
        pip install pytest
        pytest

  build-wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: windows-latest
            arch: AMD64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-latest
            arch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2
        with:
          output-dir: wheelhouse
        env:
          # Same Python range as the test matrix.
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux*"
          # Native arch per runner (x86_64/aarch64 on Linux,
          # AMD64/ARM64 on Windows, x86_64/arm64 on macOS).
          CIBW_ARCHS_LINUX: auto
          CIBW_ARCHS_WINDOWS: auto
          CIBW_ARCHS_MACOS: auto
          # Portable Linux wheels via pypa/manylinux (AlmaLinux 8 based).
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          # setup.py shells out to `cmake`, so make sure it is on PATH
          # inside the manylinux container (the PyPI `cmake` build
          # requirement alone is not guaranteed to be on PATH there).
          CIBW_BEFORE_ALL_LINUX: yum install -y cmake
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: "pytest {project}/tests -x -q"

      - name: Store the wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade build

      - name: Build a source tarball
        run: python -m build --sdist .

      - name: Store the source distribution
        uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build-wheels
    - build-sdist
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist/
          merge-multiple: true
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

